<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-schema-version="1" data-text-metrics="heuristic-v1" data-style-id="5" data-visual-theme="Glassmorphism · Tokyo Night" data-diagram-type="architecture" data-semantic-profile="generic" data-semantic-valid="true" data-quality-profile="showcase" data-max-bends-per-edge="2" data-max-total-bends="8" data-max-route-stretch="1.35" data-max-bridged-crossings="0" data-min-node-gap="40.0" data-min-container-gutter="20.0" data-min-label-clearance="4.0" data-min-segment-length="16.0">
  <title id="title">DevKeel 系统能力到仓库载体的映射</title>
  <desc id="desc">编排能力落到 AGENTS.md 与 OpenSpec，约束能力落到 rules、skills 与 agents，验证能力落到测试、构建、预览与 Review；这些资产共同形成 Agent-ready repository，驱动 Coding Agent 交付手机登录代码与可复跑证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1119"/>
      <stop offset="50%" stop-color="#171b2d"/>
      <stop offset="100%" stop-color="#0f1119"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="18%" cy="30%" r="42%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="52%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="84%" cy="34%" r="40%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="repo-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.11"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.11"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7aa2f7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb9af7"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9ece6a"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7dcfff"/>
    </marker>

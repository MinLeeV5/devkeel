  <path id="rules-to-repo" data-graph-role="edge" data-edge-id="rules-to-repo" data-source="carrier-rules" data-target="repository" data-edge-kind="flow" data-flow="write" data-bends="0" data-route-stretch="1.0" d="M 600,315 L 600,375" fill="none" stroke="#bb9af7" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <path id="evidence-to-repo" data-graph-role="edge" data-edge-id="evidence-to-repo" data-source="carrier-evidence" data-target="repository" data-edge-kind="flow" data-flow="write" data-bends="0" data-route-stretch="1.0" d="M 990,315 L 990,375" fill="none" stroke="#9ece6a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-green)"/>

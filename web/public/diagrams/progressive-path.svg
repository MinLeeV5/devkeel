<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1245" width="960" height="1245" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="1" data-visual-theme="Flat Icon · DevKeel Green" data-diagram-type="flowchart" data-semantic-profile="generic" data-semantic-valid="true" data-quality-profile="standard">
  <title id="title">DevKeel 渐进工作流与 /brainstorming 访谈循环</title>
  <desc id="desc">图从上到下依次展示一句话需求、Agent 识别任务、仓库事实核对、按需进入 /brainstorming、选择工作流。专项操作由对应 Skill 处理；方案已清晰时跳过访谈。需求与技术设计探针按需提供候选问题，合并去重后每轮只讨论一个关键决定，给出推荐、依据与代价，直到决定足够清晰。最后按任务需要选择 Direct、经确认的 Lite 或经确认的 Full；Lite 和 Full 使用 OpenSpec 编排。</desc>
  <style>
    text { font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { fill: #182033; font-size: 21px; font-weight: 700; }
    .hint { fill: #526078; font-size: 12px; font-weight: 500; }
    .section { fill: #0da97c; font-size: 20px; font-weight: 700; }
    .node-title { fill: #182033; font-size: 15px; font-weight: 700; }
    .node-subtitle { fill: #526078; font-size: 12px; }
    .tiny { fill: #526078; font-size: 11px; }
    .branch { fill: #0da97c; font-size: 12px; font-weight: 700; }
    .feedback { fill: #e56a53; font-size: 12px; font-weight: 700; }
    .legend { fill: #526078; font-size: 11px; }
  </style>

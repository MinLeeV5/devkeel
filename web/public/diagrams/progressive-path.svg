    <text class="node-title" x="420" y="91" text-anchor="middle">专项 Skill</text><text class="node-subtitle" x="420" y="111" text-anchor="middle">审查 · 调试 · 提交</text>
  </g>
  <g>
    <rect id="direct" data-node-id="direct" x="340" y="165" width="160" height="60" rx="10" fill="#eef3ff" stroke="#3563e9" stroke-width="1.5" data-graph-role="node" data-semantic-role="direct" data-graph-bounds="340,165,500,225"/>
    <text class="node-title" x="420" y="191" text-anchor="middle">Direct</text><text class="node-subtitle" x="420" y="211" text-anchor="middle">默认 · 当前会话闭环</text>
  </g>
  <g>
    <rect id="lite" data-node-id="lite" x="570" y="165" width="160" height="60" rx="10" fill="#e9f8f3" stroke="#10b981" stroke-width="1.5" data-graph-role="node" data-semantic-role="lite" data-graph-bounds="570,165,730,225"/>
    <text class="node-title" x="650" y="191" text-anchor="middle">Lite</text><text class="node-subtitle" x="650" y="211" text-anchor="middle">最少协作记忆</text>
  </g>
  <g>
    <rect id="full" data-node-id="full" x="800" y="165" width="130" height="60" rx="10" fill="#fff0ed" stroke="#ff715b" stroke-width="1.5" data-graph-role="node" data-semantic-role="full" data-graph-bounds="800,165,930,225"/>
    <text class="node-title" x="865" y="191" text-anchor="middle">Full</text><text class="node-subtitle" x="865" y="211" text-anchor="middle">完整风险治理</text>
  </g>

  <text class="branch-label" x="286" y="88" data-graph-role="label" data-owner="decision-to-skill">专项操作</text>
  <text class="branch-label" x="306" y="187" data-graph-role="label" data-owner="decision-to-direct">普通</text>
  <text class="edge-label" x="535" y="139" text-anchor="middle" data-graph-role="label" data-owner="direct-to-lite">需要协作记忆</text>
  <text class="node-subtitle" x="535" y="157" text-anchor="middle" data-graph-role="label" data-owner="direct-to-lite">确认升级</text>
  <text class="edge-label" x="765" y="117" text-anchor="middle" data-graph-role="label" data-owner="lite-to-full">高风险成立</text>
  <text class="node-subtitle" x="765" y="135" text-anchor="middle" data-graph-role="label" data-owner="lite-to-full">确认升级</text>
  <text class="node-subtitle" x="765" y="153" text-anchor="middle" data-graph-role="label" data-owner="lite-to-full">原地升级</text>

  <g data-graph-role="label">
    <text class="schema-kicker" x="30" y="310">OpenSpec 编排</text>
    <text class="schema-note" x="30" y="334">保存 artifacts</text>
    <text class="schema-note" x="30" y="354">计算下一步</text>
    <text class="schema-note" x="30" y="374">恢复跨会话上下文</text>
  </g>

  <g>
    <rect id="lite-schema" data-node-id="lite-schema" x="290" y="285" width="290" height="235" rx="12" fill="#f1fbf7" stroke="#10b981" stroke-width="1.5" data-graph-role="node" data-semantic-role="orchestration" data-graph-bounds="290,285,580,520"/>
    <text class="schema-label schema-label--lite" x="370" y="317" text-anchor="end">Lite schema</text>
    <line x1="384" y1="303" x2="384" y2="321" stroke="#8bd7bd" stroke-width="1"/>
    <text class="schema-title" x="398" y="317">最少协作记忆</text>
    <text class="schema-subtitle" x="310" y="342">2 个 planning artifacts · 快速归档</text>
    <line x1="290" y1="355" x2="580" y2="355" stroke="#bfe8d8" stroke-width="1"/>

    <line x1="326" y1="385" x2="326" y2="465" stroke="#8bd7bd" stroke-width="2"/>
    <circle cx="326" cy="380" r="10" fill="#10b981"/><text class="step-number" x="326" y="383" text-anchor="middle">01</text>
    <text class="step-title" x="350" y="377">Brainstorm + Tasks</text><text class="step-subtitle" x="350" y="393">目标 · 范围 · 验收 · 结果清单</text>
    <circle cx="326" cy="430" r="10" fill="#10b981"/><text class="step-number" x="326" y="433" text-anchor="middle">02</text>
    <text class="step-title" x="350" y="427">Apply + 验证</text><text class="step-subtitle" x="350" y="443">实施 · 邻近反馈 · diff 自审</text>
    <circle cx="326" cy="480" r="10" fill="#10b981"/><text class="step-number" x="326" y="483" text-anchor="middle">03</text>
    <text class="step-title" x="350" y="477">Archive</text><text class="step-subtitle" x="350" y="493">快速归档并停止</text>
  </g>

  <g>
    <rect id="full-schema" data-node-id="full-schema" x="620" y="285" width="310" height="235" rx="12" fill="#fff5f2" stroke="#ff715b" stroke-width="1.5" data-graph-role="node" data-semantic-role="orchestration" data-graph-bounds="620,285,930,520"/>
    <text class="schema-label schema-label--full" x="700" y="317" text-anchor="end">Full schema</text>
    <line x1="714" y1="303" x2="714" y2="321" stroke="#ffb5aa" stroke-width="1"/>
    <text class="schema-title" x="728" y="317">完整风险治理</text>
    <text class="schema-subtitle" x="640" y="342">6 个 artifacts · 审查与验证门禁</text>
    <line x1="620" y1="355" x2="930" y2="355" stroke="#ffd0c8" stroke-width="1"/>

    <line x1="656" y1="375" x2="656" y2="485" stroke="#ffb5aa" stroke-width="2"/>
    <circle cx="656" cy="370" r="9" fill="#ff715b"/><text class="step-number" x="656" y="373" text-anchor="middle">01</text>
    <text class="step-title" x="680" y="367">Brainstorm</text><text class="step-subtitle" x="680" y="382">风险与 Full 选择</text>
    <circle cx="656" cy="410" r="9" fill="#ff715b"/><text class="step-number" x="656" y="413" text-anchor="middle">02</text>
    <text class="step-title" x="680" y="407">Design + Specs + Tasks</text><text class="step-subtitle" x="680" y="422">方案 · 契约 · 最终验证计划</text>
    <circle cx="656" cy="450" r="9" fill="#ff715b"/><text class="step-number" x="656" y="453" text-anchor="middle">03</text>
    <text class="step-title" x="680" y="447">Apply + Review + Verify</text><text class="step-subtitle" x="680" y="462">实施 · P0/P1 审查 · 同指纹复验</text>
    <circle cx="656" cy="490" r="9" fill="#ff715b"/><text class="step-number" x="656" y="493" text-anchor="middle">04</text>
    <text class="step-title" x="680" y="487">Retrospective + Archive</text><text class="step-subtitle" x="680" y="502">记录偏差与证据后归档</text>
  </g>

  <g>
    <rect id="quality-baseline" data-node-id="quality-baseline" x="30" y="560" width="900" height="42" rx="11" fill="#e9f8f3" stroke="#10b981" stroke-width="1.5" data-graph-role="node" data-semantic-role="quality-gate" data-graph-bounds="30,560,930,602"/>
    <circle cx="60" cy="581" r="12" fill="#10b981"/><path d="M54 581L59 586L67 576" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="baseline-title" x="83" y="586">共同底线</text><text class="baseline-text" x="202" y="586">调查 → 实现 → 验证 → 交付</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc"
  data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="1"
  data-visual-theme="Flat Icon · DevKeel Green" data-diagram-type="flowchart" data-semantic-profile="generic"
  data-semantic-valid="true" data-quality-profile="showcase" data-max-bends-per-edge="2"
  data-max-route-stretch="1.35" data-max-bridged-crossings="0" data-min-node-gap="40"
  data-min-container-gutter="20" data-min-label-clearance="4" data-min-segment-length="16">
  <title id="title">从一句话需求开始的 DevKeel V2 渐进式任务路径</title>
  <desc id="desc">用户只需用一句话描述修复缺陷或实现需求，Agent 会自动识别任务类型。专项操作进入对应 Skill，普通任务默认从 Direct 开始；需要协作记忆时在确认后升级 Lite，高风险条件成立时在确认后原地升级 Full，再由 schema 接管后续编排。Lite 依次经过 brainstorm 和 tasks、apply 与验证、archive；Full 依次经过 brainstorm、design specs 和 tasks、apply review 和 verify、retrospective 和 archive。所有路径共享调查、实现、验证和交付底线。</desc>
  <style>
    text { font-family: "Hiragino Sans GB", "PingFang SC", "Heiti SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .hint { fill: #657083; font-size: 13px; font-weight: 600; }
    .node-title { fill: #182033; font-size: 15px; font-weight: 700; }
    .node-subtitle { fill: #657083; font-size: 11px; }
    .decision { fill: #182033; font-size: 13px; font-weight: 700; }
    .edge-label { fill: #c64f3e; font-size: 11px; font-weight: 700; }
    .branch-label { fill: #07986a; font-size: 11px; font-weight: 700; }
    .schema-kicker { fill: #07986a; font-size: 13px; font-weight: 700; }
    .schema-note { fill: #657083; font-size: 11px; }
    .schema-label { font-size: 11px; font-weight: 700; letter-spacing: .01em; }
    .schema-label--lite { fill: #07986a; }
    .schema-label--full { fill: #df503e; }
    .schema-title { fill: #182033; font-size: 14px; font-weight: 700; }
    .schema-subtitle { fill: #657083; font-size: 11px; }
    .step-number { fill: #ffffff; font-size: 9px; font-weight: 700; }
    .step-title { fill: #182033; font-size: 12px; font-weight: 700; }
    .step-subtitle { fill: #657083; font-size: 11px; }
    .baseline-title { fill: #07986a; font-size: 13px; font-weight: 700; }
    .baseline-text { fill: #445066; font-size: 13px; font-weight: 600; }
    .legend { fill: #657083; font-size: 10px; }
  </style>
  <defs>
    <marker id="arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10b981"/></marker>
    <marker id="arrow-upgrade" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ff715b"/></marker>
    <marker id="arrow-full" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ff715b"/></marker>
  </defs>

  <rect width="960" height="620" rx="18" fill="#f7f8fc" data-graph-role="background"/>
  <text class="hint" x="30" y="34">只需描述要做什么；Agent 自动匹配最短充分路径</text>

  <g data-graph-role="legend" transform="translate(625 30)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#10b981" stroke-width="2.25"/><text class="legend" x="31" y="4">自动路由</text>
    <line x1="99" y1="0" x2="123" y2="0" stroke="#ff715b" stroke-width="2" stroke-dasharray="6 5"/><text class="legend" x="130" y="4">确认升级</text>
    <line x1="203" y1="0" x2="227" y2="0" stroke="#ff715b" stroke-width="2.25"/><text class="legend" x="234" y="4">Full 编排</text>
  </g>

  <path id="task-to-decision" data-graph-role="edge" data-edge-id="task-to-decision" data-source="task" data-target="specialist-check" data-edge-kind="flow" data-flow="primary" data-bends="0" data-route-stretch="1" d="M160 195H200" fill="none" stroke="#10b981" stroke-width="2.25" marker-end="url(#arrow-primary)"/>
  <path id="decision-to-skill" data-graph-role="edge" data-edge-id="decision-to-skill" data-source="specialist-check" data-target="skill" data-edge-kind="flow" data-flow="primary" data-bends="1" data-route-stretch="1.3" d="M250 145V95H340" fill="none" stroke="#10b981" stroke-width="2.25" marker-end="url(#arrow-primary)"/>
  <path id="decision-to-direct" data-graph-role="edge" data-edge-id="decision-to-direct" data-source="specialist-check" data-target="direct" data-edge-kind="flow" data-flow="primary" data-bends="0" data-route-stretch="1" d="M300 195H340" fill="none" stroke="#10b981" stroke-width="2.25" marker-end="url(#arrow-primary)"/>
  <path id="direct-to-lite" data-graph-role="edge" data-edge-id="direct-to-lite" data-source="direct" data-target="lite" data-edge-kind="dependency" data-flow="upgrade" data-bends="0" data-route-stretch="1" d="M500 195H570" fill="none" stroke="#ff715b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-upgrade)"/>
  <path id="lite-to-full" data-graph-role="edge" data-edge-id="lite-to-full" data-source="lite" data-target="full" data-edge-kind="dependency" data-flow="upgrade" data-bends="0" data-route-stretch="1" d="M730 195H800" fill="none" stroke="#ff715b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-upgrade)"/>
  <path id="lite-to-schema" data-graph-role="edge" data-edge-id="lite-to-schema" data-source="lite" data-target="lite-schema" data-edge-kind="flow" data-flow="primary" data-bends="2" data-route-stretch="1" d="M650 225V255H435V285" fill="none" stroke="#10b981" stroke-width="2.25" marker-end="url(#arrow-primary)"/>
  <path id="full-to-schema" data-graph-role="edge" data-edge-id="full-to-schema" data-source="full" data-target="full-schema" data-edge-kind="flow" data-flow="full" data-bends="0" data-route-stretch="1" d="M865 225V285" fill="none" stroke="#ff715b" stroke-width="2.25" marker-end="url(#arrow-full)"/>

  <g>
    <rect id="task" data-node-id="task" x="30" y="165" width="130" height="60" rx="10" fill="#ffffff" stroke="#9aa4b7" stroke-width="1.5" data-graph-role="node" data-semantic-role="input" data-graph-bounds="30,165,160,225"/>
    <text class="node-title" x="95" y="190" text-anchor="middle">一句话需求</text><text class="node-subtitle" x="95" y="210" text-anchor="middle">修复缺陷 · 实现需求</text>
  </g>
  <g>
    <polygon id="specialist-check" data-node-id="specialist-check" points="250,145 300,195 250,245 200,195" fill="#fff8e8" stroke="#e3a51a" stroke-width="1.5" data-graph-role="node" data-semantic-role="decision" data-graph-bounds="200,145,300,245"/>
    <text class="decision" x="250" y="190" text-anchor="middle">Agent</text><text class="decision" x="250" y="208" text-anchor="middle">自动识别</text>
  </g>
  <g>

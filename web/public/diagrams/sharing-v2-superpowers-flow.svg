  <g id="review" data-graph-role="node" data-node-id="review" data-semantic-role="process" data-graph-bounds="700,155,794,255"><rect x="700" y="155" width="94" height="100" rx="14" fill="rgba(224,175,104,.10)" stroke="#e0af68" stroke-width="1.6"/><circle cx="716" cy="173" r="9" fill="#e0af68"/><text class="stage-num" x="716" y="177" text-anchor="middle">06</text><text class="stage" x="747" y="198" text-anchor="middle">Review</text><text class="stage-sub" x="747" y="219" text-anchor="middle">对照计划</text><text class="stage-sub" x="747" y="236" text-anchor="middle">问题阻断</text></g>

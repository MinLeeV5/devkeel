  <title id="title">Superpowers 强纪律开发流程</title>
  <desc id="desc">Superpowers 从 brainstorming 开始，依次进入 worktree、writing plans、execute、TDD、code review 与 finish。流程通过设计批准、干净基线、红绿循环和审查清零等门禁，把方法论变成必须执行的工程步骤。</desc>

  <g data-graph-role="container" data-container-id="gates" data-semantic-role="quality-gates" data-graph-bounds="36,340,924,475"><rect x="36" y="340" width="888" height="135" rx="16" fill="rgba(224,175,104,.05)" stroke="rgba(224,175,104,.22)"/><text class="gate-title" x="60" y="370">HARD GATES</text><text class="gate-sub" x="60" y="390">方法论不是建议，而是阶段转换条件</text><g transform="translate(260 360)"><rect width="140" height="72" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.12)"/><text class="gate-title" x="70" y="30" text-anchor="middle">设计已批准</text><text class="gate-sub" x="70" y="51" text-anchor="middle">才能开始实现</text></g><g transform="translate(420 360)"><rect width="140" height="72" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.12)"/><text class="gate-title" x="70" y="30" text-anchor="middle">基线可运行</text><text class="gate-sub" x="70" y="51" text-anchor="middle">才能归因变化</text></g><g transform="translate(580 360)"><rect width="140" height="72" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.12)"/><text class="gate-title" x="70" y="30" text-anchor="middle">测试先失败</text><text class="gate-sub" x="70" y="51" text-anchor="middle">才能证明测试有效</text></g><g transform="translate(740 360)"><rect width="140" height="72" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.12)"/><text class="gate-title" x="70" y="30" text-anchor="middle">审查已清零</text><text class="gate-sub" x="70" y="51" text-anchor="middle">才能完成分支</text></g></g>

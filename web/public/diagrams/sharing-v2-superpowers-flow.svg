  <g id="plan" data-graph-role="node" data-node-id="plan" data-semantic-role="process" data-graph-bounds="298,155,392,255"><rect x="298" y="155" width="94" height="100" rx="14" fill="rgba(125,207,255,.10)" stroke="#7dcfff" stroke-width="1.6"/><circle cx="314" cy="173" r="9" fill="#7dcfff"/><text class="stage-num" x="314" y="177" text-anchor="middle">03</text><text class="stage" x="345" y="198" text-anchor="middle">Plan</text><text class="stage-sub" x="345" y="219" text-anchor="middle">拆成微任务</text><text class="stage-sub" x="345" y="236" text-anchor="middle">写明验证</text></g>
  <g id="execute" data-graph-role="node" data-node-id="execute" data-semantic-role="process" data-graph-bounds="432,155,526,255"><rect x="432" y="155" width="94" height="100" rx="14" fill="rgba(158,206,106,.10)" stroke="#9ece6a" stroke-width="1.6"/><circle cx="448" cy="173" r="9" fill="#9ece6a"/><text class="stage-num" x="448" y="177" text-anchor="middle">04</text><text class="stage" x="479" y="198" text-anchor="middle">Execute</text><text class="stage-sub" x="479" y="219" text-anchor="middle">逐项执行</text><text class="stage-sub" x="479" y="236" text-anchor="middle">阶段检查</text></g>

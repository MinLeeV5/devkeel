<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" data-graph-role="diagram" data-diagram-type="process-flow" data-style="glassmorphism" data-quality-profile="showcase" data-bounds="0 0 1200 560">
  <title id="title">从 DevKeel 可靠交付到 Loop 持续改进的闭环</title>
  <desc id="desc">Agent-ready Repository 支撑手机登录任务可靠交付，验证和 Review 发现重复点击与倒计时重置问题；Loop 将反馈提炼为规则、回归测试与 AGENTS.md 地图更新，并回写 DevKeel，让下一次任务自动继承。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111522"/>
      <stop offset=".55" stop-color="#0f121c"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <linearGradient id="harness-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity=".14"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="delivery-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dcfff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#1c2039" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="review-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0af68" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1c2039" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="loop-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ece6a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity=".07"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7aa2f7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bb9af7"/>
    </marker>
    <style>
      .sans{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}.mono{font-family:'JetBrains Mono','SFMono-Regular',monospace}.text{fill:#c8d1e6}.muted{fill:#7b89a8}.dim{fill:#4a5470}.blue{fill:#7aa2f7}.cyan{fill:#7dcfff}.purple{fill:#bb9af7}.green{fill:#9ece6a}.warn{fill:#e0af68}.red{fill:#f7768e}.label{font-size:14px;font-weight:700;letter-spacing:1.6px}.title{font-size:23px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:12px}.rule{stroke:#7b89a8;stroke-opacity:.2}.edge-primary{fill:none;stroke:#7aa2f7;stroke-width:2.5;marker-end:url(#arrow-blue)}.edge-loop{fill:none;stroke:#bb9af7;stroke-width:2.5;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <path d="M0 510 H1200" class="rule"/>

  <path d="M340 190 H420" class="edge-primary" data-graph-role="edge" data-edge-id="repository-to-delivery" data-edge-start="340 190" data-edge-end="420 190" data-edge-points="340 190;420 190" data-source="harness-repository" data-target="phone-delivery"/>
  <path d="M700 190 H780" class="edge-primary" data-graph-role="edge" data-edge-id="delivery-to-review" data-edge-start="700 190" data-edge-end="780 190" data-edge-points="700 190;780 190" data-source="phone-delivery" data-target="review-feedback"/>
  <path d="M960 295 V350" class="edge-loop" data-graph-role="edge" data-edge-id="review-to-loop" data-edge-start="960 295" data-edge-end="960 350" data-edge-points="960 295;960 350" data-source="review-feedback" data-target="loop-assets"/>
  <path d="M650 415 H340" class="edge-loop" data-graph-role="edge" data-edge-id="loop-to-harness" data-edge-start="650 415" data-edge-end="340 415" data-edge-points="650 415;340 415" data-source="loop-assets" data-target="harness-repository"/>

  <text x="380" y="170" text-anchor="middle" class="mono tiny blue">执行</text>
  <text x="740" y="170" text-anchor="middle" class="mono tiny blue">验证</text>
  <text x="980" y="322" class="mono tiny purple">提炼</text>
  <text x="495" y="397" text-anchor="middle" class="mono tiny purple">回写 HARNESS</text>

  <g id="harness-repository" data-graph-role="container" data-node-id="harness-repository" data-bounds="40 70 300 420">
    <rect x="40" y="70" width="300" height="420" rx="20" fill="url(#harness-fill)" stroke="#7aa2f7" stroke-opacity=".48"/>
    <line x1="62" y1="71" x2="318" y2="71" stroke="#7aa2f7" stroke-opacity=".76"/>
    <text x="68" y="104" class="mono label blue">01 · 当前 HARNESS</text>
    <text x="68" y="142" class="sans title text">Agent-ready Repository</text>
    <text x="68" y="169" class="sans small muted">编排、约束与验证已经落进仓库</text>

    <g data-graph-role="node" data-node-id="harness-core" data-bounds="68 196 244 70">
      <rect x="68" y="196" width="244" height="70" rx="12" fill="#171b2d" fill-opacity=".8" stroke="#bb9af7" stroke-opacity=".38"/>
      <text x="190" y="225" text-anchor="middle" class="sans body text" font-weight="700">编排 + 约束 + 验证</text>
      <text x="190" y="249" text-anchor="middle" class="sans small muted">任务被路由、约束，并用证据关门</text>
    </g>

    <text x="68" y="300" class="mono tiny dim">REPOSITORY CARRIERS</text>
    <g data-graph-role="annotation" data-bounds="68 314 244 116">
      <line x1="68" y1="326" x2="312" y2="326" class="rule"/>
      <text x="68" y="350" class="mono small cyan">AGENTS.md</text><text x="312" y="350" text-anchor="end" class="sans small muted">发现与路由地图</text>
      <text x="68" y="378" class="mono small purple">rules · skills · agents</text><text x="312" y="378" text-anchor="end" class="sans small muted">执行条件</text>
      <text x="68" y="406" class="mono small green">tests · build · review</text><text x="312" y="406" text-anchor="end" class="sans small muted">完成信号</text>
    </g>
    <text x="68" y="458" class="sans small green" font-weight="700">反馈写回这里，下一次任务才会继承。</text>
  </g>

  <g id="phone-delivery" data-graph-role="node" data-node-id="phone-delivery" data-bounds="420 125 280 170">
    <rect x="420" y="125" width="280" height="170" rx="18" fill="url(#delivery-fill)" stroke="#7dcfff" stroke-opacity=".46"/>
    <line x1="442" y1="126" x2="678" y2="126" stroke="#7dcfff" stroke-opacity=".7"/>
    <text x="446" y="158" class="mono label cyan">02 · 本次交付</text>
    <text x="446" y="196" class="sans title text">手机登录交付</text>
    <text x="446" y="223" class="sans small muted">实现代码 + 可复跑证据</text>
    <line x1="446" y1="243" x2="674" y2="243" class="rule"/>
    <text x="446" y="270" class="mono small green">tests ✓</text><text x="526" y="270" class="mono small green">build ✓</text><text x="610" y="270" class="mono small green">diff ✓</text>
  </g>

  <g id="review-feedback" data-graph-role="node" data-node-id="review-feedback" data-bounds="780 125 360 170">
    <rect x="780" y="125" width="360" height="170" rx="18" fill="url(#review-fill)" stroke="#e0af68" stroke-opacity=".5"/>
    <line x1="802" y1="126" x2="1118" y2="126" stroke="#e0af68" stroke-opacity=".76"/>
    <text x="806" y="158" class="mono label warn">03 · 反馈出现</text>
    <text x="806" y="196" class="sans title text">Review 发现可复用问题</text>
    <text x="806" y="226" class="sans body warn" font-weight="700">重复点击 · 倒计时重置</text>
    <line x1="806" y1="245" x2="1114" y2="245" class="rule"/>
    <text x="806" y="273" class="sans small red">只留在报告里，下次同类任务仍会重演。</text>
  </g>

  <g id="loop-assets" data-graph-role="node" data-node-id="loop-assets" data-bounds="650 350 490 140">
    <rect x="650" y="350" width="490" height="140" rx="18" fill="url(#loop-fill)" stroke="#9ece6a" stroke-opacity=".5"/>
    <line x1="672" y1="351" x2="1118" y2="351" stroke="#9ece6a" stroke-opacity=".76"/>
    <text x="676" y="382" class="mono label green">04 · LOOP · 可复用反馈资产</text>
    <line x1="676" y1="396" x2="1114" y2="396" class="rule"/>
    <line x1="824" y1="410" x2="824" y2="462" class="rule"/>
    <line x1="998" y1="410" x2="998" y2="462" class="rule"/>
    <text x="676" y="426" class="mono tiny purple">RULE</text><text x="676" y="451" class="mono small text">rules/login.md</text><text x="676" y="472" class="sans tiny muted">重复点击 / 重置</text>
    <text x="844" y="426" class="mono tiny green">REGRESSION</text><text x="844" y="451" class="mono small text">tests/phone-login</text><text x="844" y="472" class="sans tiny muted">稳定复现失败信号</text>
    <text x="1014" y="426" class="mono tiny cyan">MAP UPDATE</text><text x="1014" y="451" class="mono small text">AGENTS.md</text><text x="1014" y="472" class="sans tiny muted">自动加载与验证</text>
  </g>

  <g data-graph-role="legend" data-bounds="420 522 360 24">
    <line x1="420" y1="534" x2="452" y2="534" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="464" y="539" class="sans small muted">执行路径</text>
    <line x1="570" y1="534" x2="602" y2="534" stroke="#bb9af7" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <text x="614" y="539" class="sans small muted">学习回路</text>
    <text x="730" y="539" class="sans small green" font-weight="700">下一次任务默认继承</text>
  </g>
</svg>
